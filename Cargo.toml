[package]
name = "phone-tool"
version = "0.1.0"
edition = "2021"
description = "通过 USB (MTP) 读取手机照片，并把照片信息 / 照片文件上传到服务器"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.36"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
] }
kamadak-exif = "0.6.1"
mtp-rs = "0.33"
reqwest = { version = "0.13", default-features = false, features = [
    "multipart",
    "json",
    "native-tls",
    "charset",
    "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }

[profile.release]
opt-level = 2
lto = "thin"
